name: build

on: [push, pull_request]

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Bot-only full game
        run: ./server --selftest 8

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build server
        run: cl /std:c++17 /EHsc /utf-8 /O2 src\server.cpp /Fe:server.exe
      - name: Build client
        run: cl /std:c++17 /EHsc /utf-8 /O2 src\client.cpp /Fe:client.exe
      - name: Bot-only full game
        run: .\server.exe --selftest 8

  # 与发布用的静态 exe 相同的构建方式 (MinGW -static)
  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static exes
        run: |
          g++ -std=c++17 -O2 -static -o server.exe src/server.cpp -lws2_32
          g++ -std=c++17 -O2 -static -o client.exe src/client.cpp -lws2_32
      - name: Bot-only full game
        run: .\server.exe --selftest 8
